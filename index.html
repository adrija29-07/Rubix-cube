<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Rubik's Cube</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cube.css">
</head>

<body>
    <div class="game-container">
        <h1 class="pixel-text">RUBIK'S CUBE</h1>
        <div class="timer-container"
            style="display: flex; align-items: center; justify-content: center; gap: 15px; margin-top: -10px; margin-bottom: 10px;">
            <img src="assets/start-transparent.png" alt="Start" onclick="startTimer()"
                style="width: 70px; cursor: pointer;" title="Start Timer">
            <div id="timer" class="pixel-text" style="font-size: 28px; color: #333;">00:00.000</div>
            <img src="assets/pause-transparent.png" alt="Pause" onclick="pauseTimer()"
                style="width: 70px; cursor: pointer;" title="Pause Timer">
        </div>
        <div class="scene">
            <div class="cube" id="cube">
                <!-- Pieces injected by JS -->
            </div>
        </div>
        <div class="controls pixel-text">
            <button onclick="rotateSlice('x', 1, 1)">R</button>
            <button onclick="rotateSlice('x', 1, -1)">R'</button>
            <button onclick="rotateSlice('x', -1, -1)">L</button>
            <button onclick="rotateSlice('x', -1, 1)">L'</button>
            <button onclick="rotateSlice('y', -1, -1)">U</button>
            <button onclick="rotateSlice('y', -1, 1)">U'</button>
            <button onclick="rotateSlice('y', 1, 1)">D</button>
            <button onclick="rotateSlice('y', 1, -1)">D'</button>
            <button onclick="rotateSlice('z', 1, 1)">F</button>
            <button onclick="rotateSlice('z', 1, -1)">F'</button>
            <button onclick="rotateSlice('z', -1, -1)">B</button>
            <button onclick="rotateSlice('z', -1, 1)">B'</button>
            <button onclick="shuffleCube(5)" style="grid-column: span 2; background: #f3ff17;">EASY SHUF</button>
            <button onclick="shuffleCube(20)" style="grid-column: span 2; background: #3b28cf;">PRO SHUF</button>
        </div>
        <div class="camera-controls pixel-text">
            <p>Drag background to rotate whole cube<br> Click & drag on cube to rotate any section</p>
        </div>
    </div>
    <script src="cubedesign.js"></script>
</body>

</html>
