<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rubik's Cube</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cube.css">
</head>

<body>
    <div class="game-container">
        <h1 class="pixel-text">NEON CUBE</h1>
        
        <div class="timer-container">
            <button class="timer-btn" onclick="startTimer()" title="Start Timer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div id="timer" class="pixel-text">00:00.000</div>
            <button class="timer-btn" onclick="pauseTimer()" title="Pause Timer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
        </div>

        <div class="scene">
            <div class="cube" id="cube">
                <!-- Pieces injected by JS -->
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="controls-group">
                <div class="controls-title">Slices</div>
                <div class="controls">
                    <button onclick="rotateSlice('x', 1, 1)" title="Right">R</button>
                    <button onclick="rotateSlice('x', 1, -1)" title="Right Prime">R'</button>
                    <button onclick="rotateSlice('x', -1, -1)" title="Left">L</button>
                    <button onclick="rotateSlice('x', -1, 1)" title="Left Prime">L'</button>
                    <button onclick="rotateSlice('y', -1, -1)" title="Up">U</button>
                    <button onclick="rotateSlice('y', -1, 1)" title="Up Prime">U'</button>
                    <button onclick="rotateSlice('y', 1, 1)" title="Down">D</button>
                    <button onclick="rotateSlice('y', 1, -1)" title="Down Prime">D'</button>
                    <button onclick="rotateSlice('z', 1, 1)" title="Front">F</button>
                    <button onclick="rotateSlice('z', 1, -1)" title="Front Prime">F'</button>
                    <button onclick="rotateSlice('z', -1, -1)" title="Back">B</button>
                    <button onclick="rotateSlice('z', -1, 1)" title="Back Prime">B'</button>
                </div>
            </div>

            <div class="controls-group">
                <div class="controls-title">System</div>
                <div class="shuffle-btns">
                    <button onclick="shuffleCube(5)" class="btn-easy">EASY</button>
                    <button onclick="shuffleCube(20)" class="btn-pro">PRO</button>
                </div>
                <button onclick="location.reload()" style="width: 100%; border-color: var(--accent-color); color: var(--accent-color);">RESET</button>
            </div>
        </div>

        <div class="camera-info">
            <p>Drag background to rotate cube • Drag cube to rotate sections<br>Keyboard: R, L, U, D, F, B (Shift for prime)</p>
        </div>
    </div>
    <script src="cubedesign.js"></script>
</body>

</html>
